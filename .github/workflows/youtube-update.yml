name: YouTube to JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Check files
        run: |
          echo "=== Files check ==="
          ls -la
          echo "=== Script check ==="
          ls -la scripts/
          echo "=== channels.txt check ==="
          cat channels.txt | head -20

      - name: Run the script
        run: python scripts/fetch_videos.py

      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update JSON [skip ci]"
          git push
